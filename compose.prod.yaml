name: backend-lab-prod

services:
  # =========================
  # PostgreSQL
  # =========================
  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      # Windows:5432 -> Container:5432
      - "5432:5432"

    volumes:
      # Preserve the existing production database.
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # =========================
  # Redis
  # =========================
  redis:
    image: redis:7
    restart: unless-stopped

    ports:
      # Windows:6379 -> Container:6379
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # =========================
  # Database role provisioning
  # =========================
  db-roles:
    image: ghcr.io/esiokao/backend-lab:${IMAGE_TAG}

    environment:
      # Admin connection used only for initial role provisioning.
      MIGRATION_ADMIN_DATABASE_URL: ${MIGRATION_ADMIN_DATABASE_URL}

      # Passwords used to create or update the application roles.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD}

    # Run the Python provisioning script as a one-shot task.
    entrypoint: ["python", "scripts/provision_roles.py"]

    depends_on:
      postgres:
        condition: service_healthy

  # =========================
  # FastAPI
  # =========================
  api:
    image: ghcr.io/esiokao/backend-lab:${IMAGE_TAG}
    restart: unless-stopped

    environment:
      # Runtime database connection: app_user.
      DATABASE_URL: ${DATABASE_URL}

      # Schema migration connection: migration_user.
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}

      # Test database setting retained for project configuration consistency.
      TEST_DATABASE_URL: ${TEST_DATABASE_URL}

      # JWT signing secret.
      JWT_SECRET: ${JWT_SECRET}

      # Docker Compose service name for Redis.
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Rate limit configuration.
      DEFAULT_RATE_LIMIT: ${DEFAULT_RATE_LIMIT}
      DEFAULT_RATE_LIMIT_WINDOW: ${DEFAULT_RATE_LIMIT_WINDOW}

      # Maximum allowed request body size.
      DEFAULT_MAX_REQUEST_SIZE: ${DEFAULT_MAX_REQUEST_SIZE}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully

  # =========================
  # Nginx
  # =========================
  nginx:
    image: nginx:alpine
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      # Nginx configuration.
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

      # TLS certificates.
      - ./certs:/etc/nginx/certs:ro

    depends_on:
      - api

# =========================
# Persistent Volumes
# =========================
volumes:
  postgres_data:
    name: backend-lab-deploy_postgres_data
