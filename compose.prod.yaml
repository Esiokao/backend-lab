name: backend-lab-prod

# 容器 log：持久在主機 + 有界（10MB × 3 = 每服務 30MB 封頂），
# 防止 json-file 預設無上限吃滿磁碟；容器重建不影響主機上的舊檔。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    logging: *default-logging
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    logging: *default-logging
    image: redis:7
    restart: unless-stopped

    # 內網也要密碼：session 全在這裡，容器網路被滲透 = 全部 session 讀寫。
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-roles:
    logging: *default-logging
    image: ghcr.io/esiokao/backend-lab:${IMAGE_TAG}
    restart: "no"

    environment:
      MIGRATION_ADMIN_DATABASE_URL: ${MIGRATION_ADMIN_DATABASE_URL}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD}

    entrypoint: ["python", "scripts/provision_roles.py"]

    depends_on:
      postgres:
        condition: service_healthy

  migration:
    logging: *default-logging
    image: ghcr.io/esiokao/backend-lab:${IMAGE_TAG}
    restart: "no"

    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}

    entrypoint: ["alembic", "upgrade", "head"]

    depends_on:
      db-roles:
        condition: service_completed_successfully

    # =========================
  # Outbox Dispatcher
  # =========================
  dispatcher:
    logging: *default-logging
    image: ghcr.io/esiokao/backend-lab:${IMAGE_TAG}
    restart: unless-stopped

    # 將 PostgreSQL Outbox 事件發布到 Redis/RQ。
    command: ["python", "-m", "app.core.outbox_dispatcher"]

    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

    # Dispatcher 沒有 HTTP health endpoint。
    healthcheck:
      disable: true

  # =========================
  # Fulfillment Worker（模擬倉儲履約）
  # =========================
  fulfillment-worker:
    logging: *default-logging
    image: ghcr.io/esiokao/backend-lab:${IMAGE_TAG}
    restart: unless-stopped

    # 依時間把已付款訂單推進 pending -> processing -> completed；
    # completed 同交易寫 order_completed outbox，通知走既有鏈路發出。
    command: ["python", "-m", "app.workers.fulfillment"]

    environment:
      DATABASE_URL: ${DATABASE_URL}

      # 履約節奏（秒）：付款後進 processing 的延遲 / 自付款起算完成的總延遲。
      FULFILLMENT_PROCESSING_DELAY_SECONDS: ${FULFILLMENT_PROCESSING_DELAY_SECONDS:-1200}
      FULFILLMENT_COMPLETION_DELAY_SECONDS: ${FULFILLMENT_COMPLETION_DELAY_SECONDS:-3600}

    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

    healthcheck:
      disable: true

  # =========================
  # Notifications Worker
  # =========================
  notifications-worker:
    logging: *default-logging
    image: ghcr.io/esiokao/backend-lab:${IMAGE_TAG}
    restart: unless-stopped

    # 消費 notifications queue 並執行通知任務。
    command: ["rq", "worker", "notifications"]

    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

    # Worker 沒有 HTTP health endpoint。
    healthcheck:
      disable: true

  api:
    logging: *default-logging
    image: ghcr.io/esiokao/backend-lab:${IMAGE_TAG}
    restart: unless-stopped

    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}

      # 付款收據的 HMAC 簽章密鑰——預設值公開在 repo 裡，prod 必須由 Secrets 覆寫
      PAYMENT_SECRET: ${PAYMENT_SECRET:?PAYMENT_SECRET must be set in .env.prod}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env.prod}

      DEFAULT_RATE_LIMIT: ${DEFAULT_RATE_LIMIT}
      DEFAULT_RATE_LIMIT_WINDOW: ${DEFAULT_RATE_LIMIT_WINDOW}
      DEFAULT_MAX_REQUEST_SIZE: ${DEFAULT_MAX_REQUEST_SIZE}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  # =========================
  # Order Expiry Worker（未付款訂單過期自動取消）
  # =========================
  order-expiry-worker:
    logging: *default-logging
    image: ghcr.io/esiokao/backend-lab:${IMAGE_TAG}
    restart: unless-stopped

    # unpaid 超過 ORDER_EXPIRY_SECONDS 未付款 → cancelled + 歸還庫存。
    command: ["python", "-m", "app.workers.order_expiry"]

    environment:
      DATABASE_URL: ${DATABASE_URL}

      ORDER_EXPIRY_SECONDS: ${ORDER_EXPIRY_SECONDS:-1800}

    depends_on:
      migration:
        condition: service_completed_successfully

    # Worker 沒有 HTTP health endpoint；不 disable 會繼承 image 的
    # HEALTHCHECK（打 127.0.0.1:8000/health）而永遠 unhealthy。
    healthcheck:
      disable: true

  # =========================
  # Frontend（靜態站，由 edge nginx 反代）
  # =========================
  frontend:
    logging: *default-logging
    image: ghcr.io/esiokao/backend-lab-frontend:${IMAGE_TAG}
    restart: unless-stopped

    depends_on:
      api:
        condition: service_healthy

  nginx:
    logging: *default-logging
    image: nginx:alpine
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      # deploy.yml 上傳的是 nginx.prod.conf（前後端路由）；伺服器上檔名維持 nginx.conf。
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro

    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  postgres_data:
    name: backend-lab-deploy_postgres_data
