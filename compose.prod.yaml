name: backend-lab-prod

services:
  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-roles:
    image: ghcr.io/esiokao/backend-lab:${IMAGE_TAG}
    restart: "no"

    environment:
      MIGRATION_ADMIN_DATABASE_URL: ${MIGRATION_ADMIN_DATABASE_URL}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD}

    entrypoint: ["python", "scripts/provision_roles.py"]

    depends_on:
      postgres:
        condition: service_healthy

  migration:
    image: ghcr.io/esiokao/backend-lab:${IMAGE_TAG}
    restart: "no"

    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}

    entrypoint: ["alembic", "upgrade", "head"]

    depends_on:
      db-roles:
        condition: service_completed_successfully

    # =========================
  # Outbox Dispatcher
  # =========================
  dispatcher:
    image: ghcr.io/esiokao/backend-lab:${IMAGE_TAG}
    restart: unless-stopped

    # 將 PostgreSQL Outbox 事件發布到 Redis/RQ。
    command: ["python", "-m", "app.core.outbox_dispatcher"]

    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

    # Dispatcher 沒有 HTTP health endpoint。
    healthcheck:
      disable: true

  # =========================
  # Fulfillment Worker（模擬倉儲履約）
  # =========================
  fulfillment-worker:
    image: ghcr.io/esiokao/backend-lab:${IMAGE_TAG}
    restart: unless-stopped

    # 依時間把已付款訂單推進 pending -> processing -> completed；
    # completed 同交易寫 order_completed outbox，通知走既有鏈路發出。
    command: ["python", "-m", "app.workers.fulfillment"]

    environment:
      DATABASE_URL: ${DATABASE_URL}

      # 履約節奏（秒）：付款後進 processing 的延遲 / 自付款起算完成的總延遲。
      FULFILLMENT_PROCESSING_DELAY_SECONDS: ${FULFILLMENT_PROCESSING_DELAY_SECONDS:-5}
      FULFILLMENT_COMPLETION_DELAY_SECONDS: ${FULFILLMENT_COMPLETION_DELAY_SECONDS:-65}

    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

    healthcheck:
      disable: true

  # =========================
  # Notifications Worker
  # =========================
  notifications-worker:
    image: ghcr.io/esiokao/backend-lab:${IMAGE_TAG}
    restart: unless-stopped

    # 消費 notifications queue 並執行通知任務。
    command: ["rq", "worker", "notifications"]

    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

    # Worker 沒有 HTTP health endpoint。
    healthcheck:
      disable: true

  api:
    image: ghcr.io/esiokao/backend-lab:${IMAGE_TAG}
    restart: unless-stopped

    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      DEFAULT_RATE_LIMIT: ${DEFAULT_RATE_LIMIT}
      DEFAULT_RATE_LIMIT_WINDOW: ${DEFAULT_RATE_LIMIT_WINDOW}
      DEFAULT_MAX_REQUEST_SIZE: ${DEFAULT_MAX_REQUEST_SIZE}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  # =========================
  # Frontend（靜態站，由 edge nginx 反代）
  # =========================
  frontend:
    image: ghcr.io/esiokao/backend-lab-frontend:${IMAGE_TAG}
    restart: unless-stopped

    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      # deploy.yml 上傳的是 nginx.prod.conf（前後端路由）；伺服器上檔名維持 nginx.conf。
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro

    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  postgres_data:
    name: backend-lab-deploy_postgres_data
