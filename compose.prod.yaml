name: backend-lab-prod

services:
  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-roles:
    image: ghcr.io/esiokao/backend-lab:${IMAGE_TAG}
    restart: "no"

    environment:
      MIGRATION_ADMIN_DATABASE_URL: ${MIGRATION_ADMIN_DATABASE_URL}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD}

    entrypoint: ["python", "scripts/provision_roles.py"]

    depends_on:
      postgres:
        condition: service_healthy

  migration:
    image: ghcr.io/esiokao/backend-lab:${IMAGE_TAG}
    restart: "no"

    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}

    entrypoint: ["alembic", "upgrade", "head"]

    depends_on:
      db-roles:
        condition: service_completed_successfully

  api:
    image: ghcr.io/esiokao/backend-lab:${IMAGE_TAG}
    restart: unless-stopped

    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      DEFAULT_RATE_LIMIT: ${DEFAULT_RATE_LIMIT}
      DEFAULT_RATE_LIMIT_WINDOW: ${DEFAULT_RATE_LIMIT_WINDOW}
      DEFAULT_MAX_REQUEST_SIZE: ${DEFAULT_MAX_REQUEST_SIZE}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  nginx:
    image: nginx:alpine
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro

    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
    name: backend-lab-deploy_postgres_data
