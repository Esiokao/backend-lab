# 正式環境 edge nginx：TLS 終結 + 前後端路由。
# dev 使用 nginx/nginx.conf（全轉 API）；本檔由 deploy.yml 上傳到部署機。
#
# 路由規則：
#   /health、/ready  → api（smoke test / 監控直連，維持 JSON）
#   /api/*           → api（剝掉 /api 前綴，與前端 api client 一致）
#   其餘             → frontend（靜態站，SPA fallback 在 frontend image 內處理）

events {}

http {
    # Docker Compose 內建 DNS。
    # 定期重新解析服務名稱，避免 API 容器重建後 IP 改變。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # HTTP → HTTPS
    server {
        listen 80;
        server_name localhost;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name localhost;

        # TLS certificate
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # 健康探測直連 api（路徑沒有 /api 前綴，保持 smoke test 相容）。
        location = /health {
            set $api_upstream api:8000;
            proxy_pass http://$api_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;   # 覆寫而非追加：client 塞的假 XFF 進不了 api（配 uvicorn --proxy-headers）
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /ready {
            set $api_upstream api:8000;
            proxy_pass http://$api_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;   # 覆寫而非追加：client 塞的假 XFF 進不了 api（配 uvicorn --proxy-headers）
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API 請求：剝掉 /api 前綴後轉發。
        # 注意：set 必須在 rewrite ... break 之前——break 會中止同 location
        # 後續的 rewrite 模組指令（含 set），否則 $api_upstream 為空 → 500。
        location /api/ {
            set $api_upstream api:8000;
            rewrite ^/api/(.*)$ /$1 break;

            proxy_pass http://$api_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;   # 覆寫而非追加：client 塞的假 XFF 進不了 api（配 uvicorn --proxy-headers）
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 其餘全部交給前端靜態站。
        location / {
            # 使用變數，讓 Nginx 透過 resolver 動態解析 frontend。
            set $frontend_upstream frontend:80;
            proxy_pass http://$frontend_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;   # 覆寫而非追加：client 塞的假 XFF 進不了 api（配 uvicorn --proxy-headers）
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
