# frontend image 內的 nginx：只負責吐靜態檔。
# TLS 與 /api 轉發都在 edge nginx（nginx.prod.conf），這裡保持單純。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 指紋過的靜態資源（Vite 帶 hash）可以長快取。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback：未知路徑回 index.html，由前端路由接手（含 404 頁）。
    # HTML 入口必須 no-cache——部署後瀏覽器立即拿到新 assets 引用，
    # 不然啟發式快取會讓使用者卡在舊版（assets 有 hash，不受影響）。
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
