services:
  # =========================
  # PostgreSQL
  # =========================
  postgres:
    image: postgres:17
    container_name: backend-lab-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    # 開發環境允許從 Windows 主機連線資料庫。
    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      # 確認 PostgreSQL 可以接受連線。
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # =========================
  # Redis
  # =========================
  redis:
    image: redis:7

    # 開發環境允許從 Windows 主機連線 Redis。
    ports:
      - "6379:6379"

    healthcheck:
      # 確認 Redis 可以正常回應。
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # =========================
  # FastAPI
  # =========================
  api:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    environment:
      # API 容器透過 Compose 網路連線 PostgreSQL：主機使用服務名稱 postgres。
      # 帳號與資料庫由環境提供（.env 或 CI 中的 API_DB_*）。
      DATABASE_URL: postgresql+psycopg://${API_DB_USER}:${API_DB_PASSWORD}@postgres:5432/${API_DB_NAME}

      JWT_SECRET: ${JWT_SECRET}

      # 使用 Compose 服務名稱連線 Redis。
      REDIS_HOST: redis
      REDIS_PORT: 6379

      DEFAULT_RATE_LIMIT: ${DEFAULT_RATE_LIMIT}
      DEFAULT_RATE_LIMIT_WINDOW: ${DEFAULT_RATE_LIMIT_WINDOW}
      DEFAULT_MAX_REQUEST_SIZE: ${DEFAULT_MAX_REQUEST_SIZE}

    depends_on:
      # API 等待資料庫和 Redis 健康後才啟動。
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # =========================
  # Nginx
  # =========================
  nginx:
    image: nginx:alpine

    ports:
      - "80:80"
      - "443:443"

    volumes:
      # Nginx 設定檔唯讀掛載。
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

      # TLS 憑證唯讀掛載。
      - ./certs:/etc/nginx/certs:ro

    depends_on:
      # API container 啟動後即可啟動 Nginx；API readiness 由測試等待。
      api:
        condition: service_started

    healthcheck:
      # 檢查 Nginx 設定語法與 master process 是否存在。
      test: ["CMD-SHELL", "nginx -t && kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# =========================
# Persistent Volumes
# =========================
volumes:
  # 持久化 PostgreSQL 資料，容器重建時保留資料。
  postgres_data:
