name: Test, Build & Publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  code-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Check code format
        run: uv run ruff format --check .

  testing:
    needs: code-check
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+psycopg://test_user:testuserpass@localhost:5432/backend_lab_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://admin:adminpass@localhost:5432/backend_lab_test
      # 資料庫連線組成部分，供 compose.yaml 組出 API 容器使用的 DATABASE_URL。
      API_DB_USER: test_user
      API_DB_PASSWORD: testuserpass
      API_DB_NAME: backend_lab_test
      TEST_DATABASE_URL: postgresql+psycopg://test_user:testuserpass@localhost:5432/backend_lab_test
      TEST_ADMIN_DATABASE_URL: postgresql://admin:adminpass@localhost:5432/backend_lab_test
      ADMIN_DATABASE_URL: postgresql://admin:adminpass@localhost:5432/backend_lab
      TEST_DATABASE_NAME: backend_lab_test
      TEST_DATABASE_USER: test_user
      TEST_DATABASE_PASSWORD: testuserpass
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpass
      POSTGRES_DB: backend_lab
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      DEFAULT_RATE_LIMIT: 5
      DEFAULT_RATE_LIMIT_WINDOW: 60
      DEFAULT_MAX_REQUEST_SIZE: 1048576

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Restore TLS private key
        env:
          TLS_PRIVATE_KEY: ${{ secrets.TLS_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$TLS_PRIVATE_KEY" > certs/server.key
          chmod 600 certs/server.key

      - name: Start PostgreSQL and Redis
        run: docker compose up -d postgres redis

      - name: Wait for PostgreSQL and Redis
        run: |
          sh scripts/wait_for.sh 60 2 \
            "docker compose logs --no-color postgres redis" \
            'docker compose exec -T postgres pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
            'docker compose exec -T redis redis-cli ping | grep -q PONG'

      - name: Setup test database
        run: uv run python scripts/setup_test_db.py

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Start API and Nginx
        run: docker compose up -d api nginx

      - name: Wait for HTTP and HTTPS endpoints
        run: |
          sh scripts/wait_for.sh 30 2 \
            "docker compose logs --no-color api nginx" \
            'curl --silent --output /dev/null --max-time 3 http://localhost/' \
            'curl --silent --insecure --output /dev/null --max-time 3 https://localhost/'

      - name: Show API and Nginx logs on failure
        if: failure()
        run: docker compose logs --no-color api nginx

      - name: Run tests
        run: uv run pytest -q -m "not deployment"

      - name: Stop Docker Compose
        if: always()
        run: docker compose down

  e2e:
    needs: code-check
    runs-on: ubuntu-latest

    env:
      # 與 testing job 相同的 DB 環境。
      DATABASE_URL: postgresql+psycopg://test_user:testuserpass@localhost:5432/backend_lab_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://admin:adminpass@localhost:5432/backend_lab_test
      API_DB_USER: test_user
      API_DB_PASSWORD: testuserpass
      API_DB_NAME: backend_lab_test
      TEST_DATABASE_URL: postgresql+psycopg://test_user:testuserpass@localhost:5432/backend_lab_test
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpass
      POSTGRES_DB: backend_lab
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      DEFAULT_RATE_LIMIT: 50
      DEFAULT_RATE_LIMIT_WINDOW: 60
      DEFAULT_MAX_REQUEST_SIZE: 1048576

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore TLS private key
        env:
          TLS_PRIVATE_KEY: ${{ secrets.TLS_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$TLS_PRIVATE_KEY" > certs/server.key
          chmod 600 certs/server.key

      - name: Start PostgreSQL and Redis
        run: docker compose up -d postgres redis

      - name: Setup test database
        run: uv run python scripts/setup_test_db.py

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Start API and Nginx
        # DEFAULT_RATE_LIMIT=50：e2e 全程共用一個 IP，/login 5 次/分鐘會把
        # 連續登入擋成 429（生產維持 5 不變，僅此 job 的容器環境放寬）。
        run: docker compose up -d api nginx

      - name: Wait for API
        run: sh scripts/wait_for.sh 30 2 "docker compose logs --no-color api" 'curl --silent --output /dev/null --max-time 3 http://localhost:8000/health'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Start Vite dev server
        working-directory: frontend
        run: |
          nohup npm run dev -- --port 5173 > /tmp/vite.log 2>&1 &
          sh ../scripts/wait_for.sh 30 2 "cat /tmp/vite.log" 'curl --silent --output /dev/null --max-time 3 http://localhost:5173/'

      - name: Seed catalog for e2e
        # CI 的 DB 是全新的：店面要有在庫商品，store 旅程才找得到 Add to cart。
        run: docker compose exec -T postgres psql -U admin -d backend_lab_test -f - < e2e/seed.sql

      - name: Install Playwright browser
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run e2e journeys
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 7

      - name: Stop Docker Compose
        if: always()
        run: docker compose down

  docker-build:
    needs: testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag backend-lab:${{ github.sha }} .

      - name: Save Docker image
        run: docker save backend-lab:${{ github.sha }} -o backend-lab.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-lab-image
          path: backend-lab.tar

  frontend-docker-build:
    needs: testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Frontend Docker image
        run: docker build --tag backend-lab-frontend:${{ github.sha }} ./frontend

      - name: Save Docker image
        run: docker save backend-lab-frontend:${{ github.sha }} -o backend-lab-frontend.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-lab-frontend-image
          path: backend-lab-frontend.tar

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker-build, frontend-docker-build, e2e]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-lab-image

      - name: Download Frontend Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-lab-frontend-image

      - name: Load Docker images
        run: |
          docker load -i backend-lab.tar
          docker load -i backend-lab-frontend.tar

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Tag and push backend image
        run: |
          docker tag backend-lab:${{ github.sha }} "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:${{ github.sha }}"

      # Frontend image 與後端同一個 commit sha，部署機用同一個 IMAGE_TAG 對齊版本。
      - name: Tag and push frontend image
        run: |
          docker tag backend-lab-frontend:${{ github.sha }} "$IMAGE_NAME-frontend:${{ github.sha }}"
          docker push "$IMAGE_NAME-frontend:${{ github.sha }}"
