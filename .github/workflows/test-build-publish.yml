name: Test, Build & Publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  code-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Check code format
        run: uv run ruff format --check .

      - name: Python type-check (pyrefly)
        run: uv run pyrefly check app

  testing:
    needs: code-check
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+psycopg://test_user:testuserpass@localhost:5432/backend_lab_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://admin:adminpass@localhost:5432/backend_lab_test
      # 資料庫連線組成部分，供 compose.yaml 組出 API 容器使用的 DATABASE_URL。
      API_DB_USER: test_user
      API_DB_PASSWORD: testuserpass
      API_DB_NAME: backend_lab_test
      TEST_DATABASE_URL: postgresql+psycopg://test_user:testuserpass@localhost:5432/backend_lab_test
      TEST_ADMIN_DATABASE_URL: postgresql://admin:adminpass@localhost:5432/backend_lab_test
      ADMIN_DATABASE_URL: postgresql://admin:adminpass@localhost:5432/backend_lab
      TEST_DATABASE_NAME: backend_lab_test
      TEST_DATABASE_USER: test_user
      TEST_DATABASE_PASSWORD: testuserpass
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpass
      POSTGRES_DB: backend_lab
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      DEFAULT_RATE_LIMIT: 5
      DEFAULT_RATE_LIMIT_WINDOW: 60
      DEFAULT_MAX_REQUEST_SIZE: 1048576

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Restore TLS private key
        env:
          TLS_PRIVATE_KEY: ${{ secrets.TLS_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$TLS_PRIVATE_KEY" > certs/server.key
          chmod 600 certs/server.key

      - name: Start PostgreSQL and Redis
        run: docker compose up -d postgres redis

      - name: Wait for PostgreSQL and Redis
        run: |
          sh scripts/wait_for.sh 60 2 \
            "docker compose logs --no-color postgres redis" \
            'docker compose exec -T postgres pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
            'docker compose exec -T redis redis-cli ping | grep -q PONG'

      - name: Setup test database
        run: uv run python scripts/setup_test_db.py

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Start API and Nginx
        run: docker compose up -d api nginx

      - name: Wait for HTTP and HTTPS endpoints
        run: |
          sh scripts/wait_for.sh 30 2 \
            "docker compose logs --no-color api nginx" \
            'curl --silent --output /dev/null --max-time 3 http://localhost/' \
            'curl --silent --insecure --output /dev/null --max-time 3 https://localhost/'

      - name: Show API and Nginx logs on failure
        if: failure()
        run: docker compose logs --no-color api nginx

      - name: Run tests
        # coverage 只量 in-process 的測試；打容器 API 的整合測試不在內——數字偏低，方向正確。
        run: uv run pytest -q -m "not deployment" --junitxml=results/junit.xml --cov=app --cov-report=json:results/coverage.json --cov-report=term-missing

      - name: Append pytest summary
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import json
          import os
          import xml.etree.ElementTree as ET
          NL = chr(10)

          root = ET.parse('results/junit.xml').getroot()
          suite = root if root.tag == 'testsuite' else root.find('testsuite')

          def number(name):
              return int(suite.get(name, 0))

          total = number('tests')
          failed = number('failures')
          errors = number('errors')
          skipped = number('skipped')
          status = 'PASS' if failed + errors == 0 else 'FAIL'
          coverage = '—'
          try:
              coverage = f"{json.load(open('results/coverage.json'))['totals']['percent_covered']:.1f}%"
          except Exception:
              pass

          head = '## pytest' + NL
          table = '| Suite | Status | Tests | Failed | Errors | Skipped | Retries | Time | Coverage |' + NL
          table += '|---|---|---:|---:|---:|---:|---:|---:|---:|' + NL
          table += '| pytest | ' + status + ' | ' + str(total) + ' | ' + str(failed) + ' | ' + str(errors) + ' | ' + str(skipped) + ' | 0 | ' + str(suite.get('time', '—')) + 's | ' + coverage + ' |' + NL
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(head + table)
          EOF

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: results/
          retention-days: 7

      - name: Stop Docker Compose
        if: always()
        run: docker compose down

  e2e:
    needs: code-check
    runs-on: ubuntu-latest

    env:
      # 與 testing job 相同的 DB 環境。
      DATABASE_URL: postgresql+psycopg://test_user:testuserpass@localhost:5432/backend_lab_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://admin:adminpass@localhost:5432/backend_lab_test
      API_DB_USER: test_user
      API_DB_PASSWORD: testuserpass
      API_DB_NAME: backend_lab_test
      TEST_DATABASE_URL: postgresql+psycopg://test_user:testuserpass@localhost:5432/backend_lab_test
      ADMIN_DATABASE_URL: postgresql://admin:adminpass@localhost:5432/backend_lab
      TEST_ADMIN_DATABASE_URL: postgresql://admin:adminpass@localhost:5432/backend_lab_test
      TEST_DATABASE_NAME: backend_lab_test
      TEST_DATABASE_USER: test_user
      TEST_DATABASE_PASSWORD: testuserpass
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpass
      POSTGRES_DB: backend_lab
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      DEFAULT_RATE_LIMIT: 50
      DEFAULT_RATE_LIMIT_WINDOW: 60
      DEFAULT_MAX_REQUEST_SIZE: 1048576

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore TLS private key
        env:
          TLS_PRIVATE_KEY: ${{ secrets.TLS_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$TLS_PRIVATE_KEY" > certs/server.key
          chmod 600 certs/server.key

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Start PostgreSQL and Redis
        run: docker compose up -d postgres redis

      - name: Setup test database
        run: uv run python scripts/setup_test_db.py

      - name: Run database migrations
        run: uv run alembic upgrade head

      # 通知管線：outbox → dispatcher → worker → SSE。
      # bell 旅程需要它——沒有 dispatcher/worker，通知永遠不會被建立。
      # 放在 migration 之後：worker 起來時 schema 一定就位，不用靠自癒。
      - name: Start notification pipeline
        run: docker compose up -d dispatcher notifications-worker

      - name: Start API and Nginx
        # DEFAULT_RATE_LIMIT=50：e2e 全程共用一個 IP，/login 5 次/分鐘會把
        # 連續登入擋成 429（生產維持 5 不變，僅此 job 的容器環境放寬）。
        run: docker compose up -d api nginx

      - name: Wait for API
        run: sh scripts/wait_for.sh 30 2 "docker compose logs --no-color api" 'curl --silent --output /dev/null --max-time 3 http://localhost:8000/health'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            e2e/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Start Vite dev server
        working-directory: frontend
        run: |
          nohup pnpm run dev -- --port 5173 > /tmp/vite.log 2>&1 &
          sh ../scripts/wait_for.sh 30 2 "cat /tmp/vite.log" 'curl --silent --output /dev/null --max-time 3 http://localhost:5173/'

      # 商品 seed 由 e2e 的 setup project 負責（auth.setup.ts 讀 e2e/seed.sql）：
      # setup 一定跑在旅程之前，CI 這裡不需要再注入一次。

      - name: Install Playwright browser
        working-directory: e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Typecheck e2e TypeScript
        working-directory: e2e
        run: pnpm exec tsc --noEmit

      - name: Run e2e journeys
        working-directory: e2e
        # 退出碼是唯一真判決（retries 會讓 junit 的 errors>0）——狀態另存給 Summary。
        run: |
          if pnpm exec playwright test; then
            echo PASS > results/status.txt
          else
            echo FAIL > results/status.txt
            exit 1
          fi

      - name: Append e2e summary
        if: always()
        continue-on-error: true
        working-directory: e2e
        run: |
          node - <<'EOF'
          const fs = require('fs');
          let summary = '## e2e' + '\n\n' + '| Suite | Status | Tests | Failed | Errors | Skipped | Retries | Time | Coverage |' + '\n' + '|---|---|---:|---:|---:|---:|---:|---:|---:|' + '\n' + '| e2e | FAIL | — | — | — | — | — | — | — |' + '\n';
          try {
            const root = fs.readFileSync('results/e2e.xml', 'utf8').slice(0, 500);
            const num = (re) => { const m = root.match(re); return m ? Number(m[1]) : 0; };
            const time = (root.match(/time="([\d.]+)"/) || [])[1] || '—';
            const status = fs.readFileSync('results/status.txt', 'utf8').trim();
            const retries = status === 'PASS' ? num(/errors="(\d+)"/) : 0;
            summary = '## e2e' + '\n\n' + '| Suite | Status | Tests | Failed | Errors | Skipped | Retries | Time | Coverage |' + '\n' + '|---|---|---:|---:|---:|---:|---:|---:|---:|' + '\n' + '| e2e | ' + status + ' | ' + num(/tests="(\d+)"/) + ' | ' + num(/failures="(\d+)"/) + ' | ' + (status === 'PASS' ? 0 : num(/errors="(\d+)"/)) + ' | ' + num(/skipped="(\d+)"/) + ' | ' + retries + ' | ' + time + 's | — |' + '\n';
          } catch {}
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          EOF

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 7

      - name: Stop Docker Compose
        if: always()
        run: docker compose down

  vitest:
    needs: code-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run vitest
        working-directory: frontend
        run: pnpm exec vitest run --reporter=junit --outputFile=results/vitest.xml

      - name: Append vitest summary
        if: always()
        continue-on-error: true
        working-directory: frontend
        run: |
          node - <<'EOF'
          const fs = require('fs');
          let summary = '## vitest' + '\n\n' + '| Suite | Status | Tests | Failed | Errors | Skipped | Retries | Time | Coverage |' + '\n' + '|---|---|---:|---:|---:|---:|---:|---:|---:|' + '\n' + '| vitest | FAIL | — | — | — | — | — | — | — |' + '\n';
          try {
            const head = fs.readFileSync('results/vitest.xml', 'utf8').slice(0, 500);
            const num = (re) => { const m = head.match(re); return m ? Number(m[1]) : 0; };
            const time = (head.match(/time="([\d.]+)"/) || [])[1] || '—';
            const failed = num(/failures="(\d+)"/);
            const errors = num(/errors="(\d+)"/);
            const status = failed + errors === 0 ? 'PASS' : 'FAIL';
            summary = '## vitest' + '\n\n' + '| Suite | Status | Tests | Failed | Errors | Skipped | Retries | Time | Coverage |' + '\n' + '|---|---|---:|---:|---:|---:|---:|---:|---:|' + '\n' + '| vitest | ' + status + ' | ' + num(/tests="(\d+)"/) + ' | ' + failed + ' | ' + errors + ' | ' + num(/skipped="(\d+)"/) + ' | 0 | ' + time + 's | — |' + '\n';
          } catch {}
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          EOF

  docker-build:
    needs: code-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag backend-lab:${{ github.sha }} .

      - name: Save Docker image
        run: docker save backend-lab:${{ github.sha }} -o backend-lab.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-lab-image
          path: backend-lab.tar

  frontend-docker-build:
    needs: code-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Frontend Docker image
        run: >-
          docker build
          --build-arg VITE_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY }}
          --tag backend-lab-frontend:${{ github.sha }}
          ./frontend

      - name: Save Docker image
        run: docker save backend-lab-frontend:${{ github.sha }} -o backend-lab-frontend.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-lab-frontend-image
          path: backend-lab-frontend.tar

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [testing, docker-build, frontend-docker-build, e2e]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-lab-image

      - name: Download Frontend Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-lab-frontend-image

      - name: Load Docker images
        run: |
          docker load -i backend-lab.tar
          docker load -i backend-lab-frontend.tar

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Tag and push backend image
        run: |
          docker tag backend-lab:${{ github.sha }} "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:${{ github.sha }}"

      # Frontend image 與後端同一個 commit sha，部署機用同一個 IMAGE_TAG 對齊版本。
      - name: Tag and push frontend image
        run: |
          docker tag backend-lab-frontend:${{ github.sha }} "$IMAGE_NAME-frontend:${{ github.sha }}"
          docker push "$IMAGE_NAME-frontend:${{ github.sha }}"
