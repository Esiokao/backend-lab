name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Check code quality without starting the application environment.
  code-check:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Python.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Install uv.
      - name: Install uv
        run: pip install uv

      # Install project dependencies.
      - name: Install dependencies
        run: uv sync --locked --all-groups

      # Check lint rules.
      - name: Run Ruff lint
        run: uv run ruff check .

      # Check code formatting.
      - name: Check code format
        run: uv run ruff format --check .

  # Run tests in the complete Docker Compose environment.
  testing:
    needs: code-check
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+psycopg://admin:adminpass@localhost:5432/backend_lab
      MIGRATION_DATABASE_URL: postgresql+psycopg://admin:adminpass@localhost:5432/backend_lab_test
      TEST_DATABASE_URL: postgresql+psycopg://test_user:testuserpass@localhost:5432/backend_lab_test
      TEST_ADMIN_DATABASE_URL: postgresql://admin:adminpass@localhost:5432/backend_lab_test
      ADMIN_DATABASE_URL: postgresql://admin:adminpass@localhost:5432/backend_lab
      TEST_DATABASE_NAME: backend_lab_test
      TEST_DATABASE_USER: test_user
      TEST_DATABASE_PASSWORD: testuserpass
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpass
      POSTGRES_DB: backend_lab
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      DEFAULT_RATE_LIMIT: 5
      DEFAULT_RATE_LIMIT_WINDOW: 60
      DEFAULT_MAX_REQUEST_SIZE: 1048576

    steps:
      # Checkout repository.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Python.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Install uv.
      - name: Install uv
        run: pip install uv

      # Install project dependencies.
      - name: Install dependencies
        run: uv sync --locked --all-groups

      # Restore the TLS private key required by Nginx.
      - name: Setup TLS private key
        env:
          TLS_PRIVATE_KEY: ${{ secrets.TLS_PRIVATE_KEY }}
        run: |
          # Restore the private key from GitHub Secrets.
          printf '%s\n' "$TLS_PRIVATE_KEY" > certs/server.key

          # Restrict access to the private key.
          chmod 600 certs/server.key

      # Start Docker Compose.
      - name: Start Docker Compose
        run: docker compose up -d

      # Create the test database, role, and privileges.
      - name: Setup test database
        run: uv run python scripts/setup_test_db.py

      # Apply schema using the migration/admin account.
      - name: Run database migrations
        run: uv run alembic upgrade head

      # Run all tests against the test database.
      - name: Run tests
        run: uv run pytest -q -m "not deployment"

      # Always stop the test environment.
      - name: Stop Docker Compose
        if: always()
        run: docker compose down

  # Build the Docker image once.
  docker-build:
    needs: testing
    runs-on: ubuntu-latest

    steps:
      # Checkout repository.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build the Docker image.
      - name: Build Docker image
        run: docker build --tag backend-lab:${{ github.sha }} .

      # Export the Docker image as a file.
      - name: Save Docker image
        run: docker save backend-lab:${{ github.sha }} -o backend-lab.tar

      # Upload the image so the publish job can use it.
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-lab-image
          path: backend-lab.tar

  # Publish the already-built image to GitHub Container Registry.
  # Only publish images from pushes to main.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker-build
    runs-on: ubuntu-latest

    # Allow GitHub Actions to push images to GHCR.
    permissions:
      contents: read
      packages: write

    steps:
      # Download the image artifact from the docker-build job.
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-lab-image

      # Load the Docker image into this runner.
      - name: Load Docker image
        run: docker load -i backend-lab.tar

      # Log in to GitHub Container Registry.
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Convert the repository name to lowercase for Docker.
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Tag the existing image with its GHCR address.
      - name: Tag Docker image
        run: docker tag backend-lab:${{ github.sha }} $IMAGE_NAME:${{ github.sha }}

      # Push the existing image to GHCR.
      - name: Push the existing image to GHCR
        run: docker push $IMAGE_NAME:${{ github.sha }}
