name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: adminpass
          POSTGRES_DB: backend_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d backend_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://admin:adminpass@localhost:5432/backend_lab
      JWT_SECRET: ci-only-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install uv
      - run: uv sync --locked --all-groups
      - run: uv run alembic upgrade head
      - run: uv run pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag backend-lab:${{ github.sha }} .
