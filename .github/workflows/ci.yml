name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  code-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Check code format
        run: uv run ruff format --check .

  testing:
    needs: code-check
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+psycopg://test_user:testuserpass@localhost:5432/backend_lab_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://admin:adminpass@localhost:5432/backend_lab_test
      # 資料庫連線組成部分，供 compose.yaml 組出 API 容器使用的 DATABASE_URL。
      API_DB_USER: test_user
      API_DB_PASSWORD: testuserpass
      API_DB_NAME: backend_lab_test
      TEST_DATABASE_URL: postgresql+psycopg://test_user:testuserpass@localhost:5432/backend_lab_test
      TEST_ADMIN_DATABASE_URL: postgresql://admin:adminpass@localhost:5432/backend_lab_test
      ADMIN_DATABASE_URL: postgresql://admin:adminpass@localhost:5432/backend_lab
      TEST_DATABASE_NAME: backend_lab_test
      TEST_DATABASE_USER: test_user
      TEST_DATABASE_PASSWORD: testuserpass
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpass
      POSTGRES_DB: backend_lab
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      DEFAULT_RATE_LIMIT: 5
      DEFAULT_RATE_LIMIT_WINDOW: 60
      DEFAULT_MAX_REQUEST_SIZE: 1048576

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Restore TLS private key
        env:
          TLS_PRIVATE_KEY: ${{ secrets.TLS_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$TLS_PRIVATE_KEY" > certs/server.key
          chmod 600 certs/server.key

      - name: Start PostgreSQL and Redis
        run: docker compose up -d postgres redis

      - name: Wait for PostgreSQL and Redis
        run: |
          sh scripts/wait_for.sh 60 2 \
            "docker compose logs --no-color postgres redis" \
            'docker compose exec -T postgres pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
            'docker compose exec -T redis redis-cli ping | grep -q PONG'

      - name: Setup test database
        run: uv run python scripts/setup_test_db.py

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Start API and Nginx
        run: docker compose up -d api nginx

      - name: Wait for HTTP and HTTPS endpoints
        run: |
          sh scripts/wait_for.sh 30 2 \
            "docker compose logs --no-color api nginx" \
            'curl --silent --output /dev/null --max-time 3 http://localhost/' \
            'curl --silent --insecure --output /dev/null --max-time 3 https://localhost/'

      - name: Show API and Nginx logs on failure
        if: failure()
        run: docker compose logs --no-color api nginx

      - name: Run tests
        run: uv run pytest -q -m "not deployment"

      - name: Stop Docker Compose
        if: always()
        run: docker compose down

  docker-build:
    needs: testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag backend-lab:${{ github.sha }} .

      - name: Save Docker image
        run: docker save backend-lab:${{ github.sha }} -o backend-lab.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-lab-image
          path: backend-lab.tar

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker-build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-lab-image

      - name: Load Docker image
        run: docker load -i backend-lab.tar

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Tag Docker image
        run: docker tag backend-lab:${{ github.sha }} "$IMAGE_NAME:${{ github.sha }}"

      - name: Push Docker image
        run: docker push "$IMAGE_NAME:${{ github.sha }}"
