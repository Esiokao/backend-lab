name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

jobs:
  deploy:
    # Only deploy after a successful push to main.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:
      # Connect this GitHub-hosted runner to the Tailscale network.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      # Verify that the runner can reach the WSL deployment server.
      - name: Check deployment server
        run: ping -c 3 100.117.73.86

      # Verify that the runner can log in to the WSL deployment server.
      - name: Check SSH connection
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/backend_lab_deploy
          chmod 600 ~/.ssh/backend_lab_deploy

          ssh \
            -i ~/.ssh/backend_lab_deploy \
            -o StrictHostKeyChecking=no \
            perry@100.117.73.86 \
            "echo 'SSH connection successful'"
