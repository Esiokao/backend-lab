name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

jobs:
  deploy:
    # 只在 main 的 CI 成功後執行部署。
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    env:
      # 部署 CI 成功的 commit 對應的 immutable image。
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

      # Deployment server 設定由 GitHub Actions Variables 提供。
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}

    steps:
      # Checkout 本次 CI 對應的 commit。
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # 連接 GitHub-hosted runner 到 Tailscale network。
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      # 確認 deployment server 可以連線。
      - name: Check deployment server
        run: ping -c 3 "$DEPLOY_HOST"

      # 建立 SSH private key。
      - name: Setup SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/backend_lab_deploy
          chmod 600 ~/.ssh/backend_lab_deploy

      # 確認 SSH 可以登入 WSL。
      - name: Check SSH connection
        timeout-minutes: 1
        run: |
          timeout 60s ssh -vvv \
            -i ~/.ssh/backend_lab_deploy \
            -o StrictHostKeyChecking=no \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "echo SSH_OK"

      # 建立 deployment workspace。
      - name: Prepare deployment directory
        run: |
          ssh \
            -i ~/.ssh/backend_lab_deploy \
            -o StrictHostKeyChecking=no \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p \
             '$DEPLOY_DIR/nginx' \
             '$DEPLOY_DIR/certs'"

      # 傳送 production Compose 設定。
      - name: Upload compose file
        run: |
          scp \
            -i ~/.ssh/backend_lab_deploy \
            -o StrictHostKeyChecking=no \
            compose.prod.yaml \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/compose.prod.yaml"

      # 傳送 Nginx 設定。
      - name: Upload nginx config
        run: |
          scp \
            -i ~/.ssh/backend_lab_deploy \
            -o StrictHostKeyChecking=no \
            nginx/nginx.conf \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/nginx/nginx.conf"

      # 傳送公開 TLS certificate。
      - name: Upload TLS certificate
        run: |
          scp \
            -i ~/.ssh/backend_lab_deploy \
            -o StrictHostKeyChecking=no \
            certs/server.crt \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/certs/server.crt"

      # 從 GitHub Secret 還原 TLS private key。
      - name: Restore TLS private key
        env:
          TLS_PRIVATE_KEY: ${{ secrets.TLS_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$TLS_PRIVATE_KEY" > certs/server.key
          chmod 600 certs/server.key

      # 傳送 TLS private key 到 deployment server。
      - name: Upload TLS private key
        run: |
          scp \
            -i ~/.ssh/backend_lab_deploy \
            -o StrictHostKeyChecking=no \
            certs/server.key \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/certs/server.key"

      # 限制 deployment server 上 private key 的權限。
      - name: Secure TLS private key
        run: |
          ssh \
            -i ~/.ssh/backend_lab_deploy \
            -o StrictHostKeyChecking=no \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod 600 '$DEPLOY_DIR/certs/server.key'"

          rm -f certs/server.key

      # 在 GitHub-hosted runner 上產生 production environment file。
      - name: Generate production environment file
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATION_DB_PASSWORD: ${{ secrets.MIGRATION_DB_PASSWORD }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -eu
          umask 077

          # 本版本假設 POSTGRES_PASSWORD 與 MIGRATION_DB_PASSWORD
          # 使用 URL 安全字元，避免連線 URL 解析錯誤。
          printf '%s\n' \
            "POSTGRES_USER=admin" \
            "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" \
            "POSTGRES_DB=backend_lab" \
            "APP_DB_PASSWORD=$APP_DB_PASSWORD" \
            "DATABASE_URL=$DATABASE_URL" \
            "MIGRATION_DB_PASSWORD=$MIGRATION_DB_PASSWORD" \
            "MIGRATION_ADMIN_DATABASE_URL=postgresql://admin:$POSTGRES_PASSWORD@postgres:5432/backend_lab" \
            "MIGRATION_DATABASE_URL=postgresql+psycopg://migration_user:$MIGRATION_DB_PASSWORD@postgres:5432/backend_lab" \
            "TEST_DATABASE_URL=$TEST_DATABASE_URL" \
            "JWT_SECRET=$JWT_SECRET" \
            "IMAGE_TAG=$IMAGE_TAG" \
            "DEFAULT_RATE_LIMIT=5" \
            "DEFAULT_RATE_LIMIT_WINDOW=60" \
            "DEFAULT_MAX_REQUEST_SIZE=1048576" \
            > .env.prod

          # 將產生的 .env.prod 傳到 deployment server。
          scp \
            -i ~/.ssh/backend_lab_deploy \
            -o StrictHostKeyChecking=no \
            .env.prod \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/.env.prod"

          # 限制 production environment file 權限。
          ssh \
            -i ~/.ssh/backend_lab_deploy \
            -o StrictHostKeyChecking=no \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod 600 '$DEPLOY_DIR/.env.prod'"

          # Runner 上的暫存檔不再需要。
          rm -f .env.prod

      # 使用 .env.prod 中的 IMAGE_TAG 部署 immutable image。
      - name: Deploy application
        run: |
          ssh \
            -i ~/.ssh/backend_lab_deploy \
            -o StrictHostKeyChecking=no \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_DIR' && \
             docker compose \
             --env-file .env.prod \
             -f compose.prod.yaml pull && \
             docker compose \
             --env-file .env.prod \
             -f compose.prod.yaml up -d"

      # 確認 production containers 狀態。
      - name: Verify deployment
        run: |
          ssh \
            -i ~/.ssh/backend_lab_deploy \
            -o StrictHostKeyChecking=no \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_DIR' && \
             docker compose \
             --env-file .env.prod \
             -f compose.prod.yaml ps"

      # 確認 Production 實際使用這次 CI 建立的 image。
      - name: Verify deployed image
        run: |
          ssh \
            -i ~/.ssh/backend_lab_deploy \
            -o StrictHostKeyChecking=no \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_DIR' && \
             EXPECTED_IMAGE='ghcr.io/esiokao/backend-lab:$IMAGE_TAG' && \
             CONTAINER_ID=\$(docker compose \
               --env-file .env.prod \
               -f compose.prod.yaml \
               ps -q api) && \
             test -n \"\$CONTAINER_ID\" && \
             ACTUAL_IMAGE=\$(docker inspect \
               \"\$CONTAINER_ID\" \
               --format='{{.Config.Image}}') && \
             echo \"Expected image: \$EXPECTED_IMAGE\" && \
             echo \"Actual image:   \$ACTUAL_IMAGE\" && \
             test \"\$ACTUAL_IMAGE\" = \"\$EXPECTED_IMAGE\""

      # 在 deployment server 上安裝 uv 與 dependencies。
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # 安裝 dependencies。
      - name: Install dependencies
        run: uv sync --locked --all-groups

      # 執行 deployment smoke tests。
      - name: Post-deploy smoke test
        env:
          DEPLOY_BASE_URL: https://${{ vars.DEPLOY_HOST }}
        run: |
          uv run pytest -m deployment
