repos:
  # Basic file checks.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # Python formatter.（rev 與 pyproject 的 ruff 版本對齊，避免本地 hook 與 CI 規則不一致）
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix]

  # Frontend type-check (vue-tsc) on frontend changes.
  - repo: local
    hooks:
      - id: vue-tsc
        name: frontend typecheck (vue-tsc)
        entry: bash -c "cd frontend && pnpm exec vue-tsc -b"
        language: system
        files: ^frontend/
        pass_filenames: false

  # E2E checks (tsc + eslint + prettier) on e2e changes.
  - repo: local
    hooks:
      - id: e2e-tsc
        name: e2e typecheck (tsc)
        entry: bash -c "cd e2e && pnpm exec tsc --noEmit"
        language: system
        files: ^e2e/
        pass_filenames: false

      - id: e2e-eslint
        name: e2e lint (eslint)
        entry: bash -c "cd e2e && pnpm exec eslint ."
        language: system
        files: ^e2e/
        pass_filenames: false

      - id: e2e-prettier
        name: e2e format check (prettier)
        entry: bash -c "cd e2e && pnpm exec prettier --check ."
        language: system
        files: ^e2e/
        pass_filenames: false
