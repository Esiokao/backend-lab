repos:
  # Basic file checks.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # Python formatter.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix]

  # Frontend type-check (vue-tsc) on frontend changes.
  - repo: local
    hooks:
      - id: vue-tsc
        name: frontend typecheck (vue-tsc)
        entry: bash -c "cd frontend && pnpm exec vue-tsc -b"
        language: system
        files: ^frontend/
        pass_filenames: false
